<script>
  // GANTI dengan URL Web App Apps Script yang aktif,

  const URL_APPS_SCRIPT =

  const statusEl = document.getElementById('status');

  let pemindai = null;

  function tampilkanStatus(pesan) {
    statusEl.textContent = pesan;
  }

  function ambilToken(teksQR) {
    const teks = String(teksQR || '').trim();

    // QR yang sudah ada biasanya berisi URL dengan ?k=TOKEN.
    try {
      const url = new URL(teks);
      const token = url.searchParams.get('k');

      if (token) return token.trim();
    } catch (error) {
      // QR mungkin berisi token secara langsung.
    }

    // Mendukung QR yang berisi token mentah.
    // Token kosong atau berupa URL biasa ditolak.
    if (teks && !/^https?:\/\//i.test(teks)) {
      return teks;
    }

    return '';
  }

  async function hentikanKamera() {
    if (pemindai) {
      try {
        await pemindai.stop();
      } catch (error) {
        // Kamera mungkin sudah berhenti.
      }
    }
  }
function kirimAbsensiJSONP(token) {
  return new Promise(function(resolve, reject) {
    const callback = 'absensiCallback_' +
      Date.now() + '_' +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');
    const batasWaktu = setTimeout(function() {
      bersihkan();
      reject(new Error(
        'Server tidak merespons. Periksa koneksi internet.'
      ));
    }, 20000);

    function bersihkan() {
      clearTimeout(batasWaktu);
      delete window[callback];
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callback] = function(data) {
      bersihkan();
      resolve(data);
    };

    const url = new URL(URL_APPS_SCRIPT);
    url.searchParams.set('aksi', 'absensi_jsonp');
    url.searchParams.set('token', token);
    url.searchParams.set('callback', callback);
    url.searchParams.set('_', String(Date.now()));

    script.src = url.toString();
    script.onerror = function() {
      bersihkan();
      reject(new Error(
        'Gagal menghubungi server absensi.'
      ));
    };

    document.head.appendChild(script);
  });
}

  async function mulaiPemindaian() {
    tombolMulai.hidden = true;
    sedangMemproses = false;

    try {
      if (!window.isSecureContext) {
        throw new Error(
          'Halaman harus dibuka melalui HTTPS.'
        );
      }

      if (!window.Html5Qrcode) {
        throw new Error(
          'Pustaka pemindai gagal dimuat. Periksa internet.'
        );
      }

      if (!pemindai) {
        pemindai = new Html5Qrcode('reader');
      }

      tampilkanStatus('Meminta akses kamera...');

      await pemindai.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        async function(teksQR) {
          if (sedangMemproses) return;

          const token = ambilToken(teksQR);

          if (!token) {
            tampilkanStatus(
              'QR tidak berisi token absensi yang valid.'
            );
            return;
          }

          sedangMemproses = true;
          
tampilkanStatus('QR terbaca. Mengirim absensi ke server...');
await hentikanKamera();

try {
  const hasil = await kirimAbsensiJSONP(token);

  if (hasil.sukses) {
    tampilkanStatus('BERHASIL: ' + hasil.pesan);
  } else {
    tampilkanStatus('GAGAL: ' + hasil.pesan);
  }
} catch (error) {
  tampilkanStatus('GAGAL: ' + error.message);
}

setTimeout(async function() {
  sedangMemproses = false;
  await mulaiPemindaian();
}, 2500);

## 2.4. Simpan dan uji

1. Klik **Commit changes** di GitHub.
2. Buka kembali halaman pemindai GitHub Pages.
3. Muat ulang halaman.
4. Pindai satu QR siswa untuk pengujian.

Hasil yang diharapkan:

- Status menampilkan hasil absensi: `BERHASIL` atau `GAGAL`.
- Sekitar 2,5 detik kemudian kamera mencoba aktif kembali.
- Jika siswa yang sama sudah tercatat pada tanggal tersebut, sistem dapat menampilkan pesan duplikasi sesuai validasi yang sudah ada.
